<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".15"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes jetFly{0%{transform:translate(-100px,220px) scale(.7);opacity:.2}50%{transform:translate(600px,120px) scale(.9);opacity:.8}}@keyframes pulse{0%{opacity:.2;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}.bg{fill:url(#bgGrad)}.grid-line{stroke:#334155;stroke-width:.5;stroke-dasharray:4 4;opacity:.4}.radar-circle{fill:none;stroke:#38bdf8;stroke-width:1;opacity:.15}.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:#fff}.subtitle-text{font-weight:500;font-size:18px;fill:#94a3b8}.highlight-text{fill:url(#accentGrad);font-weight:700}.badge-bg{fill:#1e293b;stroke:#38bdf8;stroke-width:1.5;rx:6px}.badge-text{font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600;fill:#38bdf8}.animated-jet{animation:jetFly 12s infinite linear}.gear-spin{animation:rotateGear 20s infinite linear;transform-origin:1050px 160px}</style><rect width="1200" height="320" class="bg" rx="12"/><g><line x1="0" x2="1200" y1="80" y2="80" class="grid-line"/><line x1="0" x2="1200" y1="160" y2="160" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/><line x1="200" x2="200" y1="0" y2="320" class="grid-line"/><line x1="400" x2="400" y1="0" y2="320" class="grid-line"/><line x1="600" x2="600" y1="0" y2="320" class="grid-line"/><line x1="800" x2="800" y1="0" y2="320" class="grid-line"/><line x1="1000" x2="1000" y1="0" y2="320" class="grid-line"/></g><g opacity=".25"><circle cx="1050" cy="160" r="120" class="radar-circle"/><circle cx="1050" cy="160" r="80" class="radar-circle"/><circle cx="1050" cy="160" r="40" class="radar-circle"/><g class="gear-spin"><circle cx="1050" cy="160" r="60" fill="none" stroke="#38bdf8" stroke-dasharray="12 8" stroke-width="6"/></g></g><g class="animated-jet"><path fill="url(#accentGrad)" d="M-50,0 L100,-30 L80,0 L100,30 Z" filter="url(#glow)" opacity=".6"/><line x1="-150" x2="-10" y1="0" y2="0" stroke="#38bdf8" stroke-dasharray="8 4" stroke-width="3" opacity=".4"/></g><rect width="1200" height="5" x="0" y="0" fill="url(#accentGrad)"/><g><g transform="translate(60, 0) translate(0, 50)"><rect width="240" height="28" x="0" y="0" class="badge-bg"/><text x="12" y="19" class="badge-text">✈️ AVIATION &amp; INDUSTRIAL MRO</text></g><text x="0" y="130" class="title-text" transform="translate(60, 0)">Awesome <tspan class="highlight-text">Maintenance, Repair &amp; Overhaul</tspan></text><text x="0" y="175" class="subtitle-text" transform="translate(60, 0)">Curated Ecosystem of SaaS Platforms, Open-Source Software, &amp; Technical Records Tools</text><g><g transform="translate(60, 0) translate(0, 215) translate(0, 0)"><rect width="165" height="32" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="16" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🛠️ Technical Records</text></g><g transform="translate(60, 0) translate(0, 215) translate(177, 0)"><rect width="180" height="32" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="16" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">📋 Airworthiness Rules</text></g><g transform="translate(60, 0) translate(0, 215) translate(369, 0)"><rect width="175" height="32" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="16" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">📦 Rotables &amp; Inventory</text></g><g transform="translate(60, 0) translate(0, 215) translate(556, 0)"><rect width="155" height="32" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="16" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🛸 Drone &amp; eVTOL</text></g></g></g></svg>