<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #334155; stroke-width: 0.5; stroke-dasharray: 4 4; opacity: 0.4; }
    .radar-circle { fill: none; stroke: #38bdf8; stroke-width: 1; opacity: 0.15; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
    .highlight-text { fill: url(#accentGrad); font-weight: 700; }
    .badge-bg { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; rx: 6px; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #38bdf8; }
    
    @keyframes jetFly {
      0% { transform: translate(-100px, 220px) scale(0.7); opacity: 0.2; }
      50% { transform: translate(600px, 120px) scale(0.9); opacity: 0.8; }
      100% { transform: translate(1300px, 20px) scale(1.1); opacity: 0.2; }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }

    @keyframes rotateGear {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animated-jet { animation: jetFly 12s infinite linear; }
    .animated-pulse { animation: pulse 4s infinite ease-in-out; transform-origin: center; }
    .gear-spin { animation: rotateGear 20s infinite linear; transform-origin: 1050px 160px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" class="bg" rx="12" />

  <!-- Background Grid Pattern -->
  <g>
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="320" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="320" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="320" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="320" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="320" class="grid-line" />
  </g>

  <!-- Dynamic Dynamic Tech / Gear Elements (Background - Behind Text) -->
  <g opacity="0.25">
    <circle cx="1050" cy="160" r="120" class="radar-circle" />
    <circle cx="1050" cy="160" r="80" class="radar-circle" />
    <circle cx="1050" cy="160" r="40" class="radar-circle" />
    <!-- Spinning Gear Silhouette -->
    <g class="gear-spin">
      <circle cx="1050" cy="160" r="60" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="12 8" />
    </g>
  </g>

  <!-- Animated Jet Flight Trail (Background) -->
  <g class="animated-jet">
    <path d="M-50,0 L100,-30 L80,0 L100,30 Z" fill="url(#accentGrad)" opacity="0.6" filter="url(#glow)" />
    <line x1="-150" y1="0" x2="-10" y2="0" stroke="#38bdf8" stroke-width="3" opacity="0.4" stroke-dasharray="8 4" />
  </g>

  <!-- Decorative Top Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)" />

  <!-- FOREGROUND CONTENT (Guaranteed high visibility & clear contrast) -->
  <g transform="translate(60, 0)">
    
    <!-- Category Tag / Badge -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="240" height="28" class="badge-bg" />
      <text x="12" y="19" class="badge-text">✈️ AVIATION &amp; INDUSTRIAL MRO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title-text">
      Awesome <tspan class="highlight-text">Maintenance, Repair &amp; Overhaul</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle-text">
      Curated Ecosystem of SaaS Platforms, Open-Source Software, &amp; Technical Records Tools
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛠️ Technical Records</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(177, 0)">
        <rect x="0" y="0" width="180" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📋 Airworthiness Rules</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(369, 0)">
        <rect x="0" y="0" width="175" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📦 Rotables &amp; Inventory</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(556, 0)">
        <rect x="0" y="0" width="155" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛸 Drone &amp; eVTOL</text>
      </g>
    </g>
  </g>
</svg>
